[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyschem"
dynamic = ["version"]
description = "Python schematic rendering library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "eirikr-zhong", email = "eirikrzhong@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "parsimonious>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/eirikr-zhong/pyschem"
Repository = "https://github.com/eirikr-zhong/pyschem"

[tool.setuptools_scm]
# Version is derived from git tags (e.g. v0.1.0 -> 0.1.0).
# Run `git tag v0.1.0` then `git push --tags` to trigger a release.
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "pyschem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short -n auto"
markers = [
    "unit: unit tests, no external files or network",
    "integration: integration tests, depends on real KiCad sample files",
    "regression: regression tests, compared against golden files",
    "P0: core cases that block release",
    "P1: extended cases recommended for coverage",
    "slow: long-running tests (integration/regression)",
]

[tool.coverage.run]
source = ["lib"]
omit = [
    "lib/_version.py",
    "lib/utils/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["N802", "N818"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
